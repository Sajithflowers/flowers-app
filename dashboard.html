<style>
/* ── Dashboard, redesigned 27 Oct 2026 ─────────────────────────────
   CSS only. Every class name the render JS writes is kept, so not one
   line of the figures, the charts or the sync was touched.

   "Depth": four elevation levels instead of one flat grid, so what
   matters looks like it matters before you read it. Shadows only —
   no blur, no animation — so the phone draws it once and then sleeps.

   The approval banners below are DELIBERATELY unchanged. They stay
   champagne, same words, same tap target. Sajith decides whether to
   restyle them once he has seen them against the dark.               */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ui);background:var(--pg);color:var(--tx);
  min-height:100vh;padding-bottom:50px;}

/* ── hero ── */
.hero{background:linear-gradient(160deg,#0E2C2A,#070C0B 70%);color:var(--tx);
  padding:20px 16px 50px;position:relative;overflow:hidden;border-bottom:1px solid var(--edge);}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 260px at 18% -20%,rgba(29,185,122,.22),transparent 70%),
             radial-gradient(420px 240px at 88% 0%,rgba(196,75,240,.14),transparent 70%);}
.hero-top{display:flex;justify-content:space-between;align-items:center;
  max-width:640px;margin:0 auto;position:relative;z-index:1;gap:10px;}
.hero-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.hero-links a,.hero-links button{background:var(--inset);border:1px solid var(--insetLine);
  color:var(--tx2);padding:11px 13px;border-radius:var(--rs);font-size:10.5px;font-weight:700;
  letter-spacing:1.2px;cursor:pointer;text-decoration:none;font-family:var(--ui);
  min-height:44px;display:inline-flex;align-items:center;}
.hero-links a:hover,.hero-links button:hover{border-color:var(--acc);color:var(--tx);}
.wordmark{font-weight:300;font-size:18px;letter-spacing:5px;color:var(--tx);}
.wordmark small{display:block;font-size:8.5px;letter-spacing:3.2px;color:var(--tx3);
  margin-top:5px;text-transform:uppercase;font-weight:400;}
.greet{margin-top:24px;text-align:center;font-size:21px;font-weight:700;color:var(--tx);
  position:relative;z-index:1;letter-spacing:-.3px;animation:rise .7s both;}
.date-line{text-align:center;font-size:10.5px;color:var(--tx3);letter-spacing:2px;
  margin-top:6px;text-transform:uppercase;position:relative;z-index:1;}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

.wrap{max-width:640px;margin:0 auto;padding:0 14px;}
@media (min-width:900px){ .hero-top,.wrap{max-width:960px;} }
/* ── approval banners ─────────────────────────────────────────────
   Amber on dark, chosen 26 Oct after Sajith saw the champagne against
   the new page. Violet was the other candidate and was rejected here on
   purpose: the big sales tile directly below is already violet, and two
   violets stacked means neither one wins the eye. Amber is the only hue
   in the palette nothing else on this page uses, so the banner keeps
   being the first thing you see — which is its entire job.
   The words, the count, the tap target and the link are untouched. */
.pending-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-34px 0 16px;
  position:relative;z-index:2;}
.pending-row .pending{grid-column:1/-1;}
.pending-row.split .pending{grid-column:auto;}
@media (max-width:480px){ .pending-row.split .pending{grid-column:1/-1;} }
.pending{display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(245,165,36,.16),rgba(245,165,36,.06));
  border:1px solid rgba(245,165,36,.38);border-radius:var(--rs);
  padding:17px 16px;width:100%;cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 34px rgba(245,165,36,.1);
  animation:rise .7s .1s both;font-family:var(--ui);min-height:44px;
  transition:border-color .2s, box-shadow .2s;}
@media(hover:hover){.pending:hover{border-color:rgba(245,165,36,.7);
  box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 44px rgba(245,165,36,.2);}}
.pending .num{font-size:34px;font-weight:800;color:var(--p5);line-height:1;font-family:var(--num);}
.pending .txt{text-align:left;}
.pending .t1{font-size:13.5px;font-weight:700;color:var(--p5);letter-spacing:.3px;}
/* #8A8AA0, not the amber at low alpha: this is the quiet second line and it
   still has to clear 4.5:1 against the card behind it. */
.pending .t2{font-size:11.5px;color:var(--tx3);margin-top:2px;}
.pending .go{margin-left:auto;font-size:24px;color:var(--p5);}
.pending.allclear{background:var(--card);border:1px solid var(--edge);box-shadow:none;cursor:default;}
.pending.allclear:hover{border-color:var(--edge);box-shadow:none;}
.pending.allclear .t1,.pending.allclear .num{color:var(--ok);}
.pending.allclear .t2,.pending.allclear .go{color:var(--tx3);}

/* ── KPIs — elevation 3, and the month's figure on elevation 4 ──── */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:14px;}
.kpi{background:#111C17;border:1px solid rgba(29,185,122,.2);border-radius:var(--r);
  padding:15px 14px;min-width:0;
  box-shadow:0 12px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.03);
  animation:rise .6s both;transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s ease;}
.kpi:nth-child(2){animation-delay:.07s;}
.kpi:nth-child(3){animation-delay:.14s;}
.kpi:nth-child(4){animation-delay:.21s;}
.kpi:first-child{background:linear-gradient(150deg,var(--heroTop),#141026);
  border-color:rgba(29,185,122,.4);
  box-shadow:0 26px 60px rgba(0,0,0,.62), 0 0 44px var(--heroGlow);}
@media(hover:hover){.kpi:hover{transform:translateY(-3px);
  box-shadow:0 20px 44px rgba(0,0,0,.6), 0 0 34px var(--heroGlow);}}
.kpi .kl{font-size:9.5px;letter-spacing:1.6px;color:var(--tx3);text-transform:uppercase;font-weight:700;}
.kpi .kv{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:21px;
  color:var(--tx);font-weight:700;margin-top:8px;line-height:1.15;letter-spacing:-.5px;}
.kpi:first-child .kv{font-size:24px;}
.kpi .kv.pos{color:var(--ok);}
.kpi .kv.neg{color:var(--bad);}
.kpi .kd{font-size:11px;margin-top:5px;color:var(--tx3);}
.kpi .kd b.up{color:var(--ok);}
.kpi .kd b.down{color:var(--bad);}
.kpi .two-up{margin-top:7px;}
.kpi .tu{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.kpi .tu .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:18px;
  color:var(--tx);font-weight:700;line-height:1.2;}
.kpi .tu .n.placed{color:var(--p2ink);}
.kpi .tu .t{font-size:10.5px;color:var(--tx3);}
.kpi .tu .d{font-size:10.5px;font-weight:700;white-space:nowrap;}
.kpi .tu .d.up{color:var(--ok);}
.kpi .tu .d.down{color:var(--bad);}
/* The sparkline's base rule lives in theme.css. On the first tile the bars
   sit on the violet hero gradient, where violet-on-violet barely reads, so
   they are lifted to the brighter cyan there only. */
.kpi:first-child .spark i{background:var(--p3);}
.kpi .spark{margin-top:11px;height:26px;gap:3px;}
.kpi .tu-rule{height:1px;background:var(--insetLine);margin:6px 0 5px;}

.chart-key{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tx3);
  margin-top:9px;padding-left:4px;}
.chart-key .sw{display:inline-block;width:10px;height:10px;border-radius:2px;
  margin-right:5px;vertical-align:-1px;}
.chart-key .sw.solid{background:var(--p1);}
.chart-key .sw.pale{background:var(--p2);}

/* ── cards — elevation 2 ── */
.card{background:#15151F;border:1px solid rgba(255,255,255,.1);border-radius:var(--r);
  padding:16px 15px;box-shadow:0 4px 14px rgba(0,0,0,.42);margin-bottom:14px;
  animation:rise .6s .25s both;}
.card h3{font-size:14px;color:var(--tx);margin-bottom:13px;font-weight:700;letter-spacing:-.2px;}
.card svg{width:100%;height:auto;display:block;}

/* ── booked and pipeline — elevation 1 ── */
.booked-strip{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:#0E0E16;border:1px solid var(--edge);border-left:3px solid var(--p3);
  border-radius:var(--r);padding:15px;font-family:var(--ui);animation:rise .6s .3s both;min-height:44px;}
.booked-strip .bs-t1{display:block;font-size:13.5px;font-weight:700;color:var(--p3);letter-spacing:.2px;}
.booked-strip .bs-t2{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px;}
.booked-strip .bs-ch{margin-left:auto;color:var(--p3);font-size:19px;transition:transform .25s;}
.booked-strip.on{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent;}
.booked-strip.on .bs-ch{transform:rotate(90deg);}
.booked-open{background:#0E0E16;border:1px solid var(--edge);border-left:3px solid var(--p3);
  border-top:none;border-radius:0 0 var(--r) var(--r);padding:2px 16px 15px;margin-bottom:14px;}
.bk-month{font-size:13px;color:var(--p1);font-weight:700;margin:14px 0 2px;
  padding-bottom:6px;border-bottom:1px solid var(--insetLine);letter-spacing:.3px;}
.bk-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:13.5px;padding:9px 0;}
.bk-row .bk-k{color:var(--tx3);}
.bk-row .bk-k b{color:var(--tx);font-weight:700;}
.bk-row .bk-n{font-size:11px;color:var(--tx3);}
.bk-row .bk-v{font-weight:700;color:var(--tx);white-space:nowrap;font-family:var(--num);}
.bk-row.hi .bk-v{font-size:16px;color:var(--p3);}
.bk-quote{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.2);
  border-radius:var(--rs);padding:12px 13px;margin-top:14px;}
.bk-quote .bk-qr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;}
.bk-quote .bk-qk{color:var(--p5);}
.bk-quote .bk-qv{font-family:var(--num);font-size:15px;font-weight:700;color:var(--p5);}
.bk-quote .bk-qs{font-size:11px;color:var(--tx3);margin-top:5px;}

/* ── chips, legend, client rows ── */
.year-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:11px 15px;border:1px solid var(--insetLine);border-radius:var(--rs);
  background:var(--inset);color:var(--tx2);font-size:12px;font-weight:700;letter-spacing:.8px;
  cursor:pointer;transition:all .2s;font-family:var(--ui);min-height:44px;
  display:inline-flex;align-items:center;}
/* near-black, not white: white on emerald measures 2.54:1 and fails AA.
   The violet was dark enough to carry white and emerald is not — this is
   the rule for every filled control in the app now. */
.chip.on{background:var(--p);color:var(--onP);border-color:var(--p);box-shadow:0 0 18px var(--glow);}
.legend{display:flex;gap:16px;margin-bottom:10px;font-size:11.5px;color:var(--tx2);align-items:center;}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;
  margin-right:6px;vertical-align:-1px;}

.client{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--insetLine);}
.client:last-child{border-bottom:none;}
.client .av{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(145deg,var(--p1),var(--accdeep));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.client .cn{font-weight:700;color:var(--tx);font-size:14px;}
.client .cm{font-size:11.5px;color:var(--tx3);margin-top:1px;}
.client .cv{margin-left:auto;text-align:right;}
.client .amt{font-family:var(--num);font-size:15px;font-weight:700;color:var(--tx);}
.client .gp{font-size:11px;font-weight:700;}
.client .gp.pos{color:var(--ok);}
.client .gp.neg{color:var(--bad);}

.empty-line{color:var(--tx3);font-size:13px;font-style:italic;}
.foot{text-align:center;font-size:10.5px;color:var(--tx3);letter-spacing:3px;
  text-transform:uppercase;padding:20px 0 8px;}

/* ── landscape ─────────────────────────────────────────────────────────
   Until now this page was 960px wide and centred whatever the screen, so
   on a 1920 monitor you got the phone layout with black down both sides
   and four screens of scrolling. Above 1100px the page becomes a two
   column grid instead: four figures across the top, the two charts side
   by side, everything else full width.

   The markup did not change for this. .wrap already had exactly six
   children — banners, what's new, the KPI row, the two chart cards, and
   booked — so the two cards fall into the two columns on their own and
   the rest are told to span. Add a seventh child later and it lands in a
   column; that is the thing to remember.

   1100px, not 900: at 900 the KPI row would be four tiles of ~215px and
   "AED 1,210,400" does not fit in that. Measured, not guessed.
   The phone and the tablet are untouched by all of this. */
@media (min-width:1100px){
  .hero-top,.wrap{max-width:1340px;}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start;}
  .wrap > .pending-row,
  .wrap > #whatsNew,
  .wrap > .kpis,
  .wrap > #bookedWrap{grid-column:1/-1;}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  /* the month tile keeps its extra weight, but at a quarter width it no
     longer needs the larger figure to say so — the glow does that. */
  .kpi:first-child .kv{font-size:21px;}
  .hero{padding-bottom:56px;}
}
</style>

<style id="type-roles">/* v5.7.44 type: this page's own labels, buttons and pills */
/* label (5) */
.date-line,
.kpi .kl,
.kpi .tu .t,
.kpi .tu .d,
.foot{font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;}

/* button (2) */
.hero-links a,
.hero-links button{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;}
.kpi .kv .pc{font-size:.66em;color:var(--ink2);margin-left:1px;letter-spacing:0;}

/* ── the wordmark — one look wherever the logo appears ── */
.fl-wm{font:300 19px/1 var(--ui) !important;letter-spacing:.3em !important;color:var(--ink) !important;text-transform:uppercase;}
.fl-wm small,.fl-wm-tag{display:block;font:500 8.5px/1 var(--ui) !important;letter-spacing:.38em !important;
  color:#8FC9AE !important;text-transform:uppercase !important;margin-top:8px;}
</style>
<style id="dash2">
/* ── v5.7.45 dashboard: "command centre" ─────────────────────────────
   Same numbers, same sums; this is presentation only. */
@font-face{font-family:'JetBrains Mono';font-weight:100 800;font-display:swap;src:url(fonts/jetbrainsmono-var.woff2) format('woff2');}
:root{--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;}
body{background-image:linear-gradient(rgba(29,185,122,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(29,185,122,.03) 1px,transparent 1px),var(--ground);
  background-size:32px 32px,32px 32px,auto;background-attachment:fixed;}

/* command bar + headline */
.hero{padding:0 0 18px !important;background:linear-gradient(180deg,rgba(14,44,42,.85),rgba(7,12,11,0)) !important;}
.hero::after{display:none !important;}
.hero-top{padding:14px 20px 0 !important;align-items:center !important;}
.cmd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.live{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(74,222,128,.35);
  background:rgba(74,222,128,.08);font:500 12px var(--mono);color:var(--ok);white-space:nowrap;}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.18);animation:dpulse 2s infinite;}
.live.busy{color:var(--s);border-color:rgba(25,184,204,.4);background:rgba(25,184,204,.08);} .live.busy i{background:var(--s);}
.live.off{color:var(--ink3);border-color:var(--cardBorder);background:none;} .live.off i{background:var(--ink3);animation:none;box-shadow:none;}
@keyframes dpulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0);}}
.clock{font:500 12px var(--mono);color:var(--ink3);white-space:nowrap;}
.head{max-width:1340px;margin:22px auto 0;padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.greet{margin:0 !important;text-align:left !important;font:600 26px/1.15 var(--ui) !important;letter-spacing:-.02em !important;}
.date-line{display:none !important;}
.brief{margin-top:8px;max-width:820px;font-size:15px;line-height:1.55;color:var(--ink2);}
.brief b{color:var(--ink);font-weight:600;} .brief .up{color:var(--ok);} .brief .down{color:var(--bad);}
.period{font:500 12px var(--mono);color:var(--ink3);text-align:right;white-space:nowrap;}
.period b{display:block;font:600 13px var(--mono);color:var(--p);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.pending-row{margin:6px 0 16px !important;}

/* tiles */
.kpis{gap:14px !important;}
.kpi{position:relative;overflow:hidden;padding:16px 18px !important;border-radius:14px !important;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)) !important;
  border:1px solid var(--cardBorder) !important;}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--p),var(--s));opacity:.7;}
.kpi.warn::before{background:var(--amber);} .kpi.bad::before{background:var(--bad);}
.kl2{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);}
.kl2 .tag{text-transform:none;letter-spacing:0;padding:2px 8px;border-radius:999px;font:600 11.5px var(--mono);}
.tag.up{background:rgba(74,222,128,.12);color:var(--ok);} .tag.down{background:rgba(248,113,113,.13);color:var(--bad);} .tag.flat{background:rgba(255,255,255,.06);color:var(--ink2);}
.big{margin-top:10px;font:600 34px/1.05 var(--ui);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;}
.big small{font:500 14px var(--mono);color:var(--ink3);margin-right:6px;letter-spacing:0;vertical-align:4px;}
.big.md{font-size:28px;}
.big.pos{color:var(--ok);} .big.neg{color:var(--bad);}
.sub{margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.45;}
.sub b{color:var(--ink);font-weight:600;}
.sub .m{font-family:var(--mono);font-size:12.5px;}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
.pair .big{margin-top:0;}
.pair .lbl{font-size:12.5px;color:var(--ink3);margin-top:3px;}
.pair .alt .big{color:var(--now);}
.spk{display:block;width:100%;height:56px;margin-top:12px;}
.seg{display:flex;height:8px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.07);margin-top:14px;}
.seg i{display:block;height:100%;}
.seg .a{background:var(--p);} .seg .b{background:rgba(29,185,122,.32);}
.legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font:400 12px var(--mono);color:var(--ink3);}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
.prog{position:relative;height:10px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:16px;}
.prog>i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--s));}
.prog>b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink2);border-radius:2px;}
.prog-k{display:flex;justify-content:space-between;margin-top:8px;font:400 12px var(--mono);color:var(--ink3);}
.gauge{display:flex;align-items:center;gap:16px;margin-top:6px;}
.gauge svg{width:132px;height:80px;flex-shrink:0;}

/* charts */
.card{border-radius:14px !important;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)) !important;border:1px solid var(--cardBorder) !important;padding:18px 20px !important;}
.card h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 16px var(--ui) !important;letter-spacing:-.01em !important;text-transform:none !important;color:var(--ink) !important;}
.card h3 .hint{margin-left:auto;font:400 12px var(--mono);color:var(--ink3);}
.cwrap{position:relative;margin-top:6px;}

<script>
const me = FLApp.currentUser();
if (FLApp.isCeo()) document.getElementById('home-link').style.display = 'none';

const AED = n => 'AED ' + Math.round(n).toLocaleString('en-US');
/* the figure with its currency set small and grey in front */
const AEDk = n => '<span class="cur">AED</span>' + Math.round(n).toLocaleString('en-US');
const AEDf = n => 'AED ' + (Math.round(n * 100) / 100).toLocaleString('en-US', {minimumFractionDigits: 2});
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const now = new Date();
const CY = String(now.getFullYear());
const CM = now.getMonth() + 1;

/* greeting */
const h = now.getHours();
document.getElementById('greet').textContent =
  (h < 12 ? 'Good morning, ' : h < 17 ? 'Good afternoon, ' : 'Good evening, ') + me.name;
document.getElementById('dateline').textContent =
  now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

/* ── data ── */
const COMMISSION_PCT = 10;
const GPT = 70;   /* deliberately NOT a setting — see event-editor: Jo approves on that page */
/* a Tracker row's revenue after its discount — the sale as placed */
function trackerAfter(t) {
  return (parseFloat(t.revenue) || 0) * (1 - (parseFloat(t.discountPct) || 0) / 100);
}
function calcEvent(ev) {
  const sum = a => (a || []).reduce((s, l) => s + (parseFloat(l.qty) || 0) * (parseFloat(l.price) || 0), 0);
  const cost = sum(ev.flowers) + sum(ev.sundries) + sum(ev.other);
  const budget = parseFloat(ev.budget) || 0;
  const discount = budget * (parseFloat(ev.discountPct) || 0) / 100;
  const after = budget - discount;
  const profit = after - cost;
  return { cost, budget, after, profit, gp: after ? profit / after * 100 : 0, commission: profit > 0 ? profit * COMMISSION_PCT / 100 : 0 };
}
/* merged monthly sales: order history + official monthly totals + app events (skipping aggregate months) */
function salesRows() {
  let rows = (typeof FL_HISTORY !== 'undefined' ? FL_HISTORY : []).map(x => ({ y: x.m.slice(0, 4), m: +x.m.slice(5, 7), amount: x.a }));
  const agg = new Set();
  (typeof FL_HISTORY_MONTHLY !== 'undefined' ? FL_HISTORY_MONTHLY : []).forEach(x => {
    rows.push({ y: x.m.slice(0, 4), m: +x.m.slice(5, 7), amount: x.a });
    agg.add(x.m);
  });
  FLApp.eventsAll().filter(e => e.date && !agg.has(e.date.slice(0, 7))).forEach(e => {
    rows.push({ y: e.date.slice(0, 4), m: +e.date.slice(5, 7), amount: calcEvent(e).after });
  });
  /* A sale happens when the order goes in the Tracker; the GP sheet is written
     afterwards, once the event is over. Counting only sheets made the current
     month read AED 0 right through to the cut-off — Jo saw "no sales yet this
     month" on 7 October with nine orders already sold. Tracker orders with no
     sheet yet are therefore counted too, matched on order number so nothing is
     added twice, and marked `uncosted` so the chart can show them differently.
     Sales legitimately runs ahead of profit; GP% stays sheet-only. */
  const costed = new Set(FLApp.eventsAll().map(e => String(e.orderNo || '').trim()).filter(Boolean));
  FLApp.trackerAll().forEach(t => {
    if (!t.eventDate || agg.has(t.eventDate.slice(0, 7))) return;
    if (costed.has(String(t.orderNo || '').trim())) return;   /* its sheet already counted it */
    rows.push({ y: t.eventDate.slice(0, 4), m: +t.eventDate.slice(5, 7),
                amount: trackerAfter(t), uncosted: true });
  });
  /* admin's manual monthly totals beat everything for that month */
  Object.entries(FLApp.monthlyOverrides()).forEach(([ym, amt]) => {
    const y = ym.slice(0, 4), m = parseInt(ym.slice(5, 7));
    rows = rows.filter(r => !(r.y === y && r.m === m));
    rows.push({ y, m, amount: amt });
  });
  return rows;
}
const ROWS = salesRows();
const monthTotal = (y, m) => ROWS.filter(r => r.y === y && r.m === m).reduce((s, r) => s + r.amount, 0);
/* the part of a month that is sold but not yet costed — drawn in pale rouge */
const monthUncosted = (y, m) => ROWS.filter(r => r.y === y && r.m === m && r.uncosted).reduce((s, r) => s + r.amount, 0);
const yearToMonth = (y, upTo) => ROWS.filter(r => r.y === y && r.m <= upTo).reduce((s, r) => s + r.amount, 0);
const YEARS = [...new Set(ROWS.map(r => r.y))].sort();

/* ── pending approvals banner ── */
const evs = FLApp.eventsAll();
const pending = evs.filter(e => !(e.approval && ['approved', 'rejected'].includes(e.approval.status)));
const banner = document.getElementById('pendingBanner');
banner.style.display = '';
if (pending.length) {
  const oldest = pending.slice().sort((a, b) => (a.updated || '').localeCompare(b.updated || ''))[0];
  banner.innerHTML = '<span class="num">' + pending.length + '</span>' +
    '<span class="txt"><span class="t1">event' + (pending.length > 1 ? 's' : '') + ' waiting for review</span><br>' +
    '<span class="t2">' + (oldest && oldest.name ? '“' + oldest.name + '”' : '') + '</span></span><span class="go">›</span>';
  banner.onclick = () => location.href = 'events.html';
} else {
  banner.className = 'pending allclear';
  banner.innerHTML = '<span class="num">✓</span><span class="txt"><span class="t1">All events reviewed</span><br><span class="t2">Nothing waiting for approval</span></span>';
}

/* ── expense sheets awaiting CEO's approval — surfaced here so she never
   has to go looking for them under Tools ── */
if (FLApp.isCeo()) {
  const MONTH_NAMES_X = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dueExpenses = FLApp.expensesAll().filter(s => !(s.ceoApproval && s.ceoApproval.approved));
  const expBanner = document.getElementById('expensePendingBanner');
  if (dueExpenses.length) {
    const oldestExp = dueExpenses.slice().sort((a, b) => (a.submittedAt || '').localeCompare(b.submittedAt || ''))[0];
    const oldestLbl = oldestExp ? oldestExp.staffName + ' — ' + MONTH_NAMES_X[+oldestExp.month.slice(5, 7) - 1] + ' ' + oldestExp.month.slice(0, 4) : '';
    expBanner.style.display = '';
    expBanner.innerHTML = '<span class="num">' + dueExpenses.length + '</span>' +
      '<span class="txt"><span class="t1">expense sheet' + (dueExpenses.length > 1 ? 's' : '') + ' waiting for approval</span><br>' +
      '<span class="t2">' + oldestLbl + '</span></span><span class="go">›</span>';
    expBanner.onclick = () => location.href = 'expenses.html';
    document.querySelector('.pending-row').classList.add('split');
  }
}

/* ── expense sheets Jo just approved — surfaced to finance for a week so
   a fresh approval doesn't go unnoticed sitting in the Tools list ── */
if (FLApp.role(me) === 'finance') {
  const READY_WINDOW_DAYS = 7;
  const cutoff = Date.now() - READY_WINDOW_DAYS * 86400000;
  const readySheets = FLApp.expensesAll().filter(s =>
    s.ceoApproval && s.ceoApproval.approved && s.ceoApproval.approvedAt && new Date(s.ceoApproval.approvedAt).getTime() >= cutoff);
  const readyBanner = document.getElementById('financeReadyBanner');
  if (readySheets.length) {
    const newest = readySheets.slice().sort((a, b) => (b.ceoApproval.approvedAt || '').localeCompare(a.ceoApproval.approvedAt || ''))[0];
    readyBanner.style.display = '';
    readyBanner.innerHTML = '<span class="num">' + readySheets.length + '</span>' +
      '<span class="txt"><span class="t1">expense sheet' + (readySheets.length > 1 ? 's' : '') + ' approved &amp; ready to share</span><br>' +
      '<span class="t2">' + (newest.staffName || '') + ' — ' + MONTHS[+newest.month.slice(5, 7) - 1] + ' ' + newest.month.slice(0, 4) + '</span></span><span class="go">›</span>';
    readyBanner.onclick = () => location.href = 'expenses.html';
    document.querySelector('.pending-row').classList.add('split');
  }
}

FLApp.renderWhatsNew('whatsNew');

/* ── KPIs ── */
const monthEvs = evs.filter(e => e.date && e.date.slice(0, 4) === CY && +e.date.slice(5, 7) === CM);
let mAfter = 0, mProfit = 0;
monthEvs.forEach(e => { const c = calcEvent(e); mAfter += c.after; mProfit += c.profit; });
const mSales = monthTotal(CY, CM) || mAfter;
const mGp = mAfter ? mProfit / mAfter * 100 : null;
const prevY = String(+CY - 1);
const ytd = yearToMonth(CY, CM);
const ytdPrev = yearToMonth(prevY, CM);
const ytdDelta = ytdPrev ? (ytd - ytdPrev) / ytdPrev * 100 : null;
const mPrevYear = monthTotal(prevY, CM);
const mDelta = mPrevYear ? (mSales - mPrevYear) / mPrevYear * 100 : null;
const approvedCount = monthEvs.filter(e => e.approval && e.approval.status === 'approved').length;

/* ── the two figures in the Sales tile ──────────────────────────────────
   They answer different questions and are not meant to match:
     "events this month" — work happening in this month, whenever it was sold
     "orders placed"     — what was sold during this month, whenever it happens
   An order can be in both; neither is double-counted within itself. Where a
   placed order also has a GP sheet, the sheet's figure wins — it is the later
   document and the one Jo audits. */
const ymNow = CY + '-' + String(CM).padStart(2, '0');
const sheetByNo = {};
evs.forEach(e => { const n = String(e.orderNo || '').trim(); if (n) sheetByNo[n] = e; });
const placedRows = FLApp.trackerAll().filter(t => t.placed && t.placed.slice(0, 7) === ymNow);

}, 0);

/* ── AOV: average order value, counted like the Events tile ── */
function ordersIn(y, m) {
  const ym = y + '-' + String(m).padStart(2, '0');
  const sheets = evs.filter(e => e.date && e.date.slice(0, 7) === ym);
  const nos = new Set(sheets.map(e => String(e.orderNo || '').trim()).filter(Boolean));
  return sheets.length + FLApp.trackerAll().filter(t => t.eventDate && t.eventDate.slice(0, 7) === ym &&
    !nos.has(String(t.orderNo || '').trim())).length;
}
const aov = monthOrders ? mSales / monthOrders : null;
const pmY = CM === 1 ? prevY : CY, pmM = CM === 1 ? 12 : CM - 1;

function shareFor(y, months) {

    if (coInc[ym] != null) { e += monthTotal(y, m) / VAT; c += +coInc[ym]; } });
  return c ? e / c * 100 : null;
}

const deltaInline = d => d == null ? '' :

/* ── sparkline ────────────────────────────────────────────────────────
   Seven bars: this month and the six before it, walking back across the
   year boundary. No new data and no new maths — monthTotal is the same
   function the chart further down already uses. Heights are relative to
   the tallest of the seven, so this answers "is it going up", not "by how
   much"; the figures above it answer that. Static: drawn once, no
   animation, nothing for the phone to keep repainting.
   aria-hidden because it repeats what the numbers already say. */
const spark = (upToY, upToM) => {
  const vals = [];
  for (let i = 6; i >= 0; i--) {
    let m = upToM - i, y = upToY;
    while (m < 1) { m += 12; y -= 1; }
    vals.push(monthTotal(y, m));

  const peak = Math.max.apply(null, vals);

  return '<div class="spark" aria-hidden="true">' +
    vals.map(v => '<i style="height:' + Math.max(8, v / peak * 100).toFixed(1) + '%"></i>').join('') +
    '</div>';
};

/* ── chart palette ─────────────────────────────────────────────────────
   These used to be seven loose hex values scattered through the two chart
   functions, in the old burgundy and cream. They are collected here so the
   charts and the CSS can never drift apart again — which they had: the key
   under the sales chart was showing violet and fuchsia while the bars were
   still burgundy and rouge.

   GRID and AXIS matter more than they look. They were #F1EBE4 and #E8DDD8,
   near-white, which on this page draws them brighter than the data in front
   of them. Barely-there white is the point: the grid is there to be measured
   against, not looked at.

   The values match theme.css by hand because the charts build SVG strings
   and cannot read a CSS variable. If a colour changes there, change it here. */
/* v5.7.43: read from the stylesheet instead of being typed twice.
   The chart KEY is CSS and the BARS are drawn in JS, and in v5.7.42
   they were two separate lists of hex — after the recolour the key was
   describing colours the chart no longer used. Pulling the values off
   :root at run time means they cannot drift apart again. The literals
   are only the fallback for a browser that hands back an empty string. */
const CSSVAR = (name, fallback) => {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
};
/* SVG text is in viewBox units, so a fixed size came out at 8px on a
   monitor and 5px on a phone. Convert real pixels to units at draw time.
   Under 480px twelve labels do not fit at full size. */
function chartW() { const el = document.getElementById('salesChart'); return (el && el.clientWidth) || 620; }
function chartNarrow() { return chartW() < 480; }
function chartPx(px) { return (px * 620 / Math.max(chartW(), 240)).toFixed(1); }
const CHART = {
  grid:     'rgba(255,255,255,.07)',
  axis:     'rgba(255,255,255,.16)',
  bar:      CSSVAR('--p',    '#1DB97A'),  /* emerald, costed              */
  barHi:    CSSVAR('--now',  '#5FE3F5'),  /* the month you are in         */
  /* sold-but-not-costed is the SAME emerald at 32%, not a fourth
     colour — the same money, unfinished. 4.09:1 against the solid. */
  pale:     'rgba(29,185,122,.32)',
  label:    CSSVAR('--ink2', '#A4B3AB'),  /* the K figure above a bar     */
  axisText: CSSVAR('--ink3', '#7E8F87'),  /* JAN FEB MAR                  */
  prevYear: CSSVAR('--ink3', '#7E8F87'),  /* last year stays grey so this year reads first */
  /* was Lato,Arial — and Lato has never actually loaded in this app, so
     every chart label has silently been Arial. */
  font:     "'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace"
};

/* ── sales by month chart ── */
let salesYear = YEARS.includes(CY) ? CY : YEARS[YEARS.length - 1];
/* `pale` is the sold-but-not-yet-costed part of each month, capping the solid
   bar. Colours come from CHART above. */
function barChart(perMonth, highlightM, pale) {
  const W = 620, H = 240, padT = 28, padB = 26;
  const max = Math.max(...perMonth, 1);
  const bw = W / 12;
  const maxIdx = perMonth.indexOf(Math.max(...perMonth));
  pale = pale || [];
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  for (let g = 1; g <= 3; g++) {
    const gy = padT + (H - padT - padB) * g / 4;
    s += '<line x1="4" y1="' + gy + '" x2="' + (W - 4) + '" y2="' + gy + '" stroke="' + CHART.grid + '"/>';
  }
  s += '<line x1="4" y1="' + (H - padB) + '" x2="' + (W - 4) + '" y2="' + (H - padB) + '" stroke="' + CHART.axis + '" stroke-width="1.5"/>';
  perMonth.forEach((v, i) => {
    const x = i * bw + bw * 0.2, w = bw * 0.6;
    if (v) {
      const hh = Math.max(3, (H - padT - padB) * v / max);
      const y = H - padB - hh;
      const col = (i + 1) === highlightM ? CHART.barHi : CHART.bar;
      const u = Math.min(pale[i] || 0, v);          /* sold, sheet not made yet */
      const tip = MONTHS[i] + ': ' + AEDf(v) + (u ? ' — ' + AEDf(u) + ' sold, sheet still to make' : '');
      /* one rounded bar in up to two pieces: the costed part grows from the
         baseline in violet, the part sold without a GP sheet yet caps it in
         fuchsia. A month with no sheets yet is simply all fuchsia. */
      const slice = (top, bottom, fill, round) =>
        '<path d="M' + x + ' ' + bottom + ' L' + x + ' ' + (top + (round ? 4 : 0)) +
        (round ? ' Q' + x + ' ' + top + ' ' + (x + 4) + ' ' + top + ' L' + (x + w - 4) + ' ' + top +
                 ' Q' + (x + w) + ' ' + top + ' ' + (x + w) + ' ' + (top + 4)
               : ' L' + (x + w) + ' ' + top) +
        ' L' + (x + w) + ' ' + bottom + ' Z" fill="' + fill + '"><title>' + tip + '</title></path>';
      const uh = (H - padT - padB) * u / max;       /* height of the pale cap */
      if (u >= v) {
        s += slice(y, H - padB, CHART.pale, true);
      } else if (u > 0) {
        s += slice(y + uh, H - padB, col, false);   /* costed, square top */
        s += slice(y, y + uh, CHART.pale, true);    /* uncosted cap, rounded */
      } else {
        s += slice(y, H - padB, col, true);
      }
      s += '<text x="' + (x + w / 2) + '" y="' + (y - 6) + '" text-anchor="middle" font-size="' + chartPx(i === maxIdx ? 12.5 : 11.5) + '" font-weight="' + (i === maxIdx ? 600 : 500) + '"' + (chartNarrow() && i !== maxIdx && i + 1 !== highlightM ? ' visibility="hidden"' : '') + ' fill="' + CHART.label + '" font-family="' + CHART.font + '">' + Math.round(v / 1000) + 'K</text>';
    }
    s += '<text x="' + (x + w / 2) + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="' + chartPx(chartNarrow() ? 10.5 : 12) + '" fill="' + CHART.axisText + '" font-family="' + CHART.font + '">' + MONTHS[i].slice(0, 3) + '</text>';
  });
  return s + '</svg>';
}

function renderYoy() {

  const B = Array.from({ length: 12 }, (_, i) => monthTotal(yb, i + 1));
  const W = 620, H = 240, padT = 20, padB = 26;
  const max = Math.max(...A, ...B, 1);
  const gw = W / 12;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  for (let g = 1; g <= 3; g++) {
    const gy = padT + (H - padT - padB) * g / 4;
    s += '<line x1="4" y1="' + gy + '" x2="' + (W - 4) + '" y2="' + gy + '" stroke="' + CHART.grid + '"/>';
  }
  s += '<line x1="4" y1="' + (H - padB) + '" x2="' + (W - 4) + '" y2="' + (H - padB) + '" stroke="' + CHART.axis + '" stroke-width="1.5"/>';
  for (let i = 0; i < 12; i++) {
    const base = i * gw;
    [[A[i], CHART.prevYear, ya], [B[i], CHART.bar, yb]].forEach(([v, col, yr], k) => {
      if (!v) return;
      const w = gw * 0.32, x = base + gw * 0.14 + k * (w + 2);
      const hh = Math.max(3, (H - padT - padB) * v / max), y = H - padB - hh;
      s += '<path d="M' + x + ' ' + (H - padB) + ' L' + x + ' ' + (y + 3) + ' Q' + x + ' ' + y + ' ' + (x + 3) + ' ' + y +
        ' L' + (x + w - 3) + ' ' + y + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + 3) +
        ' L' + (x + w) + ' ' + (H - padB) + ' Z" fill="' + col + '"><title>' + MONTHS[i] + ' ' + yr + ': ' + AEDf(v) + '</title></path>';
    });
    s += '<text x="' + (base + gw / 2) + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="' + chartPx(chartNarrow() ? 10.5 : 12) + '" fill="' + CHART.axisText + '" font-family="' + CHART.font + '">' + MONTHS[i].slice(0, 3) + '</text>';
  }
  document.getElementById('yoyChart').innerHTML = s + '</svg>';
}

function areaSpark(vals, hiLast) {

  const last = pts[n - 1];
  return '<svg class="spk" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#1DB97A" stop-opacity=".45"/><stop offset="1" stop-color="#1DB97A" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + line + ' L' + last[0] + ' ' + H + ' L' + pts[0][0] + ' ' + H + ' Z" fill="url(#' + id + ')"/>' +

    (hiLast ? '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="#5FE3F5"/>' : '') + '</svg>';
}
function gaugeSvg(v, target) {
  const R = 52, cx = 66, cy = 70, a = x => Math.PI * (1 - Math.max(0, Math.min(100, x)) / 100);
  const pt = x => [cx + R * Math.cos(a(x)), cy - R * Math.sin(a(x))];
  const arc = (from, to, col, w) => { const p0 = pt(from), p1 = pt(to);
    return '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + R + ' ' + R + ' 0 0 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; };
  const t0 = pt(target), tIn = [cx + (R - 12) * Math.cos(a(target)), cy - (R - 12) * Math.sin(a(target))], tOut = [cx + (R + 9) * Math.cos(a(target)), cy - (R + 9) * Math.sin(a(target))];
  const col = v == null ? 'rgba(255,255,255,.2)' : v >= target ? '#4ADE80' : v >= target - 10 ? '#F5A524' : '#F87171';
  return '<svg viewBox="0 0 132 80" aria-hidden="true">' + arc(0, 100, 'rgba(255,255,255,.08)', 10) + (v ? arc(0, v, col, 10) : '') +

}

  const trk = FLApp.trackerAll().length;
  el.innerHTML = '<span>data as of ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '</span>' +
    '<span>' + evs.length + ' GP sheets · ' + trk + ' tracker orders</span><span>sales = tracker + GP sheets, one per order</span>' +
    '<span>GP% from costed sheets only</span><span>v' + FLApp.appVersion() + '</span>';
  document.querySelector('.foot').before(el);
})();

/* ══ v5.7.45 dashboard, part 2: Intelligence + board report ════════════
   Read-only. Built from the same helpers as everything above. Names:
   Tracker client names are admin-only (Admin › Access), so for anyone else
   orders are shown by order number, or by their GP sheet's event name. */
const CAN_NAMES = FLApp.isAdmin();
const SEES_ENQ = FLApp.isAdmin() || FLApp.isCeo();
const today2 = new Date().toISOString().slice(0, 10);
const ymOf = (y, m) => y + '-' + String(m).padStart(2, '0');
const aedK = v => 'AED ' + fmtK(v);
const aedN = v => 'AED ' + Math.round(v).toLocaleString('en-US');
const sheetOf = no => sheetByNo[String(no || '').trim()];
const orderLabel = t => { const s = sheetOf(t.orderNo); return s && s.name ? esc2(s.name) : CAN_NAMES && t.client ? esc2(t.client) : 'Order #' + esc2(t.orderNo || '—'); };
function esc2(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
const gpCls = g => g >= GPT ? 'ok' : g >= GPT - 10 ? 'mid' : 'bad';

/* GP tile says "provisional" while fewer than half the month's events are costed */
(function provisional() {
  if (!monthOrders || monthEvs.length / monthOrders >= 0.5) return;
  const tag = document.querySelector('#kpis .kpi:nth-child(2) .kl2 .tag');
  if (tag) { tag.className = 'tag prov'; tag.textContent = 'provisional · ' + monthEvs.length + '/' + monthOrders + ' costed'; }
})();

/* Board report button in the command bar */
(function boardBtn() {
  const b = document.createElement('button');
  b.className = 'btn-board';
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Board report';
  b.onclick = () => window.print();
  const cmd = document.querySelector('.cmd');
  cmd.insertBefore(b, cmd.querySelector('.hero-links'));
  const rh = document.createElement('div');
  rh.className = 'rep-head';
  rh.innerHTML = '<span><b>FLOWERS.AE · EXECUTIVE REPORT</b><br>' + MONTHS[CM - 1] + ' ' + CY + ' · events division</span>' +
    '<span>prepared ' + new Date().toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · v' + FLApp.appVersion() + '</span>';
  document.querySelector('.hero').prepend(rh);
})();

(function intel() {
  const sum = a => (a || []).reduce((s, l) => s + (parseFloat(l.qty) || 0) * (parseFloat(l.price) || 0), 0);
  const ySheets = evs.filter(e => e.date && e.date.slice(0, 4) === CY && e.date <= today2);
  const P = [];

  /* ── 1. insights, written from the numbers ── */
  const ins = [];
  const cyMonths = Array.from({ length: CM }, (_, i) => i + 1);
  const best = cyMonths.reduce((b, m) => monthTotal(CY, m) > monthTotal(CY, b) ? m : b, 1);
  let record = 0, recordLbl = '';
  YEARS.forEach(y => { for (let m = 1; m <= 12; m++) { const v = monthTotal(y, m); if (v > record) { record = v; recordLbl = MONTHS[m - 1] + ' ' + y; } } });
  const bestV = monthTotal(CY, best);
  ins.push(bestV >= record ? ['up', '★', '<b>' + MONTHS[best - 1] + ' ' + CY + '</b> is the best month on record at <b>' + aedK(bestV) + '</b>.', 'since records began in ' + YEARS[0]]
    : ['info', '★', 'Best month this year: <b>' + MONTHS[best - 1] + '</b> at <b>' + aedK(bestV) + '</b>.', 'record is ' + recordLbl + ' at ' + aedK(record)]);
  let swing = null;
  cyMonths.filter(m => m < CM).forEach(m => { const a = monthTotal(CY, m), l = monthTotal(prevY, m); if (a && l) { const d = (a - l) / l * 100; if (!swing || Math.abs(d) > Math.abs(swing.d)) swing = { m, d, a, l }; } });
  if (swing) ins.push([swing.d >= 0 ? 'up' : 'down', swing.d >= 0 ? '▲' : '▼', 'Biggest swing vs last year: <b>' + MONTHS[swing.m - 1] + '</b>, <b>' + Math.abs(swing.d).toFixed(0) + '% ' + (swing.d >= 0 ? 'higher' : 'lower') + '</b> than ' + MONTHS[swing.m - 1] + ' ' + prevY + '.', aedK(swing.a) + ' vs ' + aedK(swing.l)]);
  let leak = 0, under = 0;
  ySheets.forEach(e => { const c = calcEvent(e); if (c.after && c.gp < GPT) { leak += c.after * GPT / 100 - c.profit; under++; } });
  if (ySheets.length) ins.push([leak ? 'warn' : 'up', '%', leak ? '<b>' + aedK(leak) + '</b> of profit missed against the ' + GPT + '% target this year, across <b>' + under + '</b> of ' + ySheets.length + ' events.' : 'Every costed event this year met the ' + GPT + '% target.',
    leak ? 'what those events would have made at exactly ' + GPT + '%' : '']);
  const nm = CM === 12 ? 1 : CM + 1, ny = CM === 12 ? String(+CY + 1) : CY;
  const bookedNext = (FLApp.bookedByMonth().find(x => x.month === ymOf(ny, nm)) || { todo: 0, todoCount: 0 });
  const lastNext = monthTotal(String(+ny - 1), nm);
  ins.push(!bookedNext.todo ? ['warn', '→', 'Nothing booked yet for <b>' + MONTHS[nm - 1] + '</b>.' + (lastNext ? ' ' + MONTHS[nm - 1] + ' ' + (+ny - 1) + ' made <b>' + aedK(lastNext) + '</b>.' : ''), 'confirmed orders in the Tracker'] : ['info', '→', '<b>' + MONTHS[nm - 1] + '</b>: <b>' + aedK(bookedNext.todo) + '</b> already booked (' + bookedNext.todoCount + ' order' + (bookedNext.todoCount === 1 ? '' : 's') + ')' +
    (lastNext ? ', ' + Math.round(bookedNext.todo / lastNext * 100) + '% of what ' + MONTHS[nm - 1] + ' ' + (+ny - 1) + ' made in total.' : '.'), 'confirmed orders in the Tracker']);
  const trkY = FLApp.trackerAll().filter(t => t.eventDate && t.eventDate.slice(0, 4) === CY);
  const byClient = {};
  trkY.forEach(t => { const k = String(t.client || '').trim().toLowerCase(); if (k) byClient[k] = (byClient[k] || 0) + 1; });
  const rep = trkY.filter(t => byClient[String(t.client || '').trim().toLowerCase()] > 1);
  if (trkY.length) ins.push(['info', '↻', '<b>' + Math.round(rep.reduce((s, t) => s + trackerAfter(t), 0) / Math.max(1, trkY.reduce((s, t) => s + trackerAfter(t), 0)) * 100) + '%</b> of ' + CY + ' order value came from <b>returning clients</b>.',
    Object.values(byClient).filter(n => n > 1).length + ' clients ordered more than once']);
  P.push('<div class="panel s2"><h4>What the numbers say<span class="r">updated live</span></h4>' +
    ins.map(i => '<div class="ins ' + i[0] + '"><span class="ic">' + i[1] + '</span><div class="t">' + i[2] + (i[3] ? '<small>' + i[3] + '</small>' : '') + '</div></div>').join('') + '</div>');

  /* ── 2. margin health ── */
  const B = [['<50', 0, 50], ['50–60', 50, 60], ['60–70', 60, 70], ['70–80', 70, 80], ['80+', 80, 1e9]].map(b => ({ l: b[0], lo: b[1], hi: b[2], n: 0 }));
  let bestE = null, worstE = null, aft = 0, prof = 0;
  ySheets.forEach(e => { const c = calcEvent(e); if (!c.after) return; aft += c.after; prof += c.profit;
    const b = B.find(x => c.gp >= x.lo && c.gp < x.hi); if (b) b.n++;
    if (!bestE || c.gp > bestE.g) bestE = { e, g: c.gp }; if (!worstE || c.gp < worstE.g) worstE = { e, g: c.gp }; });
  const mx = Math.max(1, ...B.map(b => b.n));
  P.push('<div class="panel"><h4>Margin health · ' + CY + '<span class="r">' + ySheets.length + ' events</span></h4><div class="hist">' +
    B.map(b => '<div><span>' + b.n + '</span><i style="height:' + (b.n / mx * 100) + '%;background:' + (b.lo >= GPT ? 'linear-gradient(180deg,#4ADE80,#1DB97A)' : b.lo >= GPT - 10 ? '#F5A524' : '#F87171') + '"></i><em>' + b.l + '%</em></div>').join('') + '</div>' +
    '<div class="kv2"><span>Year margin</span><b class="' + (aft && prof / aft * 100 >= GPT ? 'ok' : 'bad') + '">' + (aft ? (prof / aft * 100).toFixed(1) + '%' : '—') + '</b></div>' +
    (bestE ? '<div class="kv2"><span>Best · ' + esc2(bestE.e.name) + '</span><b class="ok">' + bestE.g.toFixed(1) + '%</b></div>' : '') +
    (worstE ? '<div class="kv2"><span>Lowest · ' + esc2(worstE.e.name) + '</span><b class="bad">' + worstE.g.toFixed(1) + '%</b></div>' : '') + '</div>');

  /* ── 3. top events this month (costed sheets) ── */
  const top = monthEvs.map(e => ({ e, c: calcEvent(e) })).sort((a, b) => b.c.after - a.c.after).slice(0, 6);
  P.push('<div class="panel s2"><h4>Top events · ' + MONTHS[CM - 1] + '<span class="r">by value · costed sheets</span></h4>' +
    (top.length ? '<div style="overflow-x:auto"><table class="tt"><thead><tr><th></th><th>Event</th><th class="hide-s">Date</th><th class="n">Value</th><th class="n">Profit</th><th class="n">GP</th><th class="hide-s">Status</th></tr></thead><tbody>' +
      top.map((x, i) => '<tr><td class="rk">' + (i + 1) + '</td><td class="nm">' + esc2(x.e.name || 'Untitled') + '</td><td class="hide-s">' + fmtDay(x.e.date) + '</td><td class="n">' + aedN(x.c.after) + '</td><td class="n">' + aedN(x.c.profit) + '</td>' +
        '<td class="n"><span class="chipg ' + gpCls(x.c.gp) + '">' + x.c.gp.toFixed(1) + '%</span></td><td class="hide-s"><span class="st2 ' + (x.e.approval && x.e.approval.status === 'approved' ? 'ok">approved' : 'wait">waiting') + '</span></td></tr>').join('') +
      '</tbody></table></div>' + (monthTracked.length ? '<div class="empty2">+ ' + monthTracked.length + ' more events this month without a GP sheet yet</div>' : '')
      : '<div class="empty2">No GP sheets made for ' + MONTHS[CM - 1] + ' yet.</div>') + '</div>');

  /* ── 4. next 14 days ── */
  const in14 = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
  const soon = FLApp.trackerAll().filter(t => t.eventDate && t.eventDate >= today2 && t.eventDate <= in14).sort((a, b) => a.eventDate < b.eventDate ? -1 : 1);
  P.push('<div class="panel"><h4>Next 14 days<span class="r">' + soon.length + ' event' + (soon.length === 1 ? '' : 's') + ' · ' + aedK(soon.reduce((s, t) => s + trackerAfter(t), 0)) + '</span></h4>' +
    (soon.length ? '<div class="tl2">' + soon.slice(0, 7).map(t => { const s = sheetOf(t.orderNo);
      return '<div class="d"><span class="dt">' + fmtDay(t.eventDate) + '</span><span class="dot' + (s ? '' : ' todo') + '" title="' + (s ? 'GP sheet made' : 'no GP sheet yet') + '"></span>' +
        '<span class="w">' + orderLabel(t) + '</span><span class="v">' + aedK(trackerAfter(t)) + '</span></div>'; }).join('') +
      (soon.length > 7 ? '<div class="empty2">+ ' + (soon.length - 7) + ' more</div>' : '') + '</div>' +
      '<div class="legend2" style="margin-top:6px"><span><i style="background:var(--p);border-radius:50%"></i>sheet made</span><span><i style="border:2px solid var(--amber);border-radius:50%;background:none"></i>sheet to make</span></div>'
      : '<div class="empty2">Nothing booked in the next two weeks.</div>') + '</div>');

  /* ── 5. enquiry funnel + occasion mix (admin + CEO: finance cannot open Enquiries) ── */
  if (SEES_ENQ) {
    const enq = FLApp.enquiriesAll().filter(e => (e.enqDate || '').slice(0, 4) === CY);
    const grp = e => FLApp.statusGroup(e.status);
    const quoted = enq.filter(e => e.quoteSentDate || parseFloat(e.quoteValue) > 0 || grp(e) === 'won');
    const won = enq.filter(e => grp(e) === 'won'), lost = enq.filter(e => grp(e) === 'lost');
    const val = a => a.reduce((s, e) => s + (parseFloat(e.quoteValue) || 0), 0);
    const steps = [['Enquiries received', enq.length, null], ['Quoted', quoted.length, val(quoted)], ['Won', won.length, val(won)]];
    const reasons = {}; lost.forEach(e => { const r = (FLApp.lostReasonOf ? FLApp.lostReasonOf(e) : e.lostReason) || 'no reason given'; reasons[r] = (reasons[r] || 0) + 1; });
    const topR = Object.entries(reasons).sort((a, b) => b[1] - a[1]).slice(0, 2);
    P.push('<div class="panel"><h4>Enquiry funnel · ' + CY + '<span class="r">' + (won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) + '% win rate' : '') + '</span></h4><div class="funnel">' +
      steps.map(s => '<div class="fn"><i style="width:' + (enq.length ? Math.max(6, s[1] / enq.length * 100) : 0) + '%"></i><span>' + s[0] + '<b>' + s[1] + (s[2] ? ' · ' + aedK(s[2]) : '') + '</b></span></div>').join('') + '</div>' +
      '<div class="fn-k"><span>' + lost.length + ' lost</span><span>' + (topR.length ? 'top reason: ' + esc2(topR[0][0]) : '') + '</span></div></div>');
    const norm = o => { o = String(o || '').trim().toLowerCase(); if (!o) return 'Not set'; if (/car/.test(o)) return 'Car decoration'; if (/home|house/.test(o)) return 'Home'; if (/hotel/.test(o)) return 'Hotel';
      if (/corporate|workshop|regular/.test(o)) return 'Corporate'; return o.charAt(0).toUpperCase() + o.slice(1); };
    const occ = {}; FLApp.enquiriesAll().forEach(e => { const k = norm(e.occasion); occ[k] = occ[k] || { n: 0, w: 0 }; occ[k].n++; if (grp(e) === 'won') occ[k].w++; });
    const occT = Object.entries(occ).sort((a, b) => b[1].n - a[1].n);
    const top4 = occT.slice(0, 4), rest = occT.slice(4).reduce((s, x) => s + x[1].n, 0);
    if (rest) top4.push(['Other', { n: rest, w: 0 }]);
    P.push('<div class="panel"><h4>What clients ask for<span class="r">all enquiries</span></h4>' + donut(top4.map(x => [x[0], x[1].n]),
      x => occ[x[0]] ? ' · ' + Math.round(occ[x[0]].w / occ[x[0]].n * 100) + '% won' : '') + '</div>');
  }

  /* ── 6. cost structure ── */
  let fl = 0, su = 0, ot = 0, af = 0;
  ySheets.forEach(e => { fl += sum(e.flowers); su += sum(e.sundries); ot += sum(e.other); af += calcEvent(e).after; });
  P.push('<div class="panel"><h4>Where the money goes · ' + CY + '<span class="r">' + (af ? 'costs ' + Math.round((fl + su + ot) / af * 100) + ' fils per AED 1 sold' : '') + '</span></h4>' +
    donut([['Flowers', fl], ['Sundries', su], ['Other costs', ot], ['Profit', Math.max(0, af - fl - su - ot)]], x => '') + '</div>');

  /* ── 7. seasonality: every year, every month ── */
  const allMax = Math.max(1, ...YEARS.flatMap(y => Array.from({ length: 12 }, (_, i) => monthTotal(y, i + 1))));
  P.push('<div class="panel s3"><h4>Seasonality<span class="r">sales by month, every year · brighter = bigger</span></h4>' +
    '<div class="heat2" style="grid-template-columns:44px repeat(12,minmax(34px,1fr)) 70px"><b></b>' + MONTHS.map(m => '<em>' + m.slice(0, 3) + '</em>').join('') + '<em>total</em>' +
    YEARS.map(y => '<b>' + y + '</b>' + Array.from({ length: 12 }, (_, i) => { const v = monthTotal(y, i + 1);
      return '<span class="' + (v ? '' : 'z') + (y === CY && i + 1 === CM ? ' now' : '') + '" title="' + MONTHS[i] + ' ' + y + ' · ' + aedN(v) + '" style="background:rgba(29,185,122,' + (v ? (0.12 + 0.8 * v / allMax).toFixed(2) : '.04') + ')">' + (v ? fmtK(v) : '·') + '</span>'; }).join('') +
      '<b style="text-align:right;font-family:var(--mono)">' + fmtK(yearToMonth(y, 12)) + '</b>').join('') + '</div></div>');

  const sec = document.createElement('section');
  sec.id = 'intel';
  sec.innerHTML = '<div class="intel-h"><div><h2>Intelligence</h2><p>What is behind the numbers: margins, clients, demand and what is coming.</p></div><span class="badge2">read-only · live data</span></div>' +
    '<div class="ig">' + P.join('') + '</div>';
  document.getElementById('bookedWrap').before(sec);

  function donut(parts, extra) {
    const COL = ['#1DB97A', '#19B8CC', '#6E9BF0', '#F5A524', '#9AA39F'];
    const tot = parts.reduce((s, p) => s + p[1], 0) || 1;
    let a0 = -Math.PI / 2, s = '<svg viewBox="0 0 120 120" aria-hidden="true">';
    parts.forEach((p, i) => { const a1 = a0 + p[1] / tot * Math.PI * 2; if (p[1] > 0) {
      const big = a1 - a0 > Math.PI ? 1 : 0, r = 50, r2 = 32;
      const P1 = [60 + r * Math.cos(a0), 60 + r * Math.sin(a0)], P2 = [60 + r * Math.cos(a1 - 0.012), 60 + r * Math.sin(a1 - 0.012)];
      const Q1 = [60 + r2 * Math.cos(a1 - 0.012), 60 + r2 * Math.sin(a1 - 0.012)], Q2 = [60 + r2 * Math.cos(a0), 60 + r2 * Math.sin(a0)];
      s += '<path d="M' + P1.join(' ') + ' A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + P2.join(' ') + ' L' + Q1.join(' ') + ' A' + r2 + ' ' + r2 + ' 0 ' + big + ' 0 ' + Q2.join(' ') + ' Z" fill="' + COL[i % 5] + '"/>'; }
      a0 = a1; });
    s += '</svg>';
    return '<div class="mix">' + s + '<ul>' + parts.map((p, i) => '<li><i style="background:' + COL[i % 5] + '"></i>' + esc2(p[0]) + (extra(p) || '') + '<b>' + Math.round(p[1] / tot * 100) + '%</b></li>').join('') + '</ul></div>';
  }
})();
function fmtDay(d) { return d ? new Date(d + 'T00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) : '—'; }
</script>
